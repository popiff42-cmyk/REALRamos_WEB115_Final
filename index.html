<!DOCTYPE html>
<head>
   <title>Checkpoint Fate</title>
   <script src="script.js" defer></script>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="dialogues">
       <p id="dialogueBox">After recently moving out of your hometown of St. Petersburg, <br>
       you were offered a job at a security checkpoint in the <br>
       cold capital of Yakutsk, Russia. Are you taking the job?</p>
       <p id="names"></p>
   </div>
  
   <div class="container">
       <button id="Reject">REJECT.</button>
       <button id="Accept" onclick="acceptPerson()">ACCEPT.</button>
       <button id="beginStory" onclick="startGame()">Begin.</button>
   </div>
   
   <div class="errteh">
       <p id="timerDisplay" style="display:none;">Time: <span id="timerValue">0</span>s</p>
   </div>

   <div class="gameContainer" style="display:none;">
       <div class="infoSection">
           <h3>Database Information (REAL)</h3>
           <div id="realInfoBox" class="infoBox">
               <p><strong>Name:</strong> <span id="realName"></span></p>
               <p><strong>Age:</strong> <span id="realAge"></span></p>
               <p><strong>SSN:</strong> <span id="realSSN"></span></p>
               <p><strong>Address:</strong> <span id="realAddress"></span></p>
           </div>
       </div>
       
       <div class="personDocuments">
           <h3>Person's Claims</h3>
           <div id="claimsBox" class="claimsBox"></div>
       </div>
       
       <div id="decisionButtons" style="margin-top: 20px;">
           <button id="AcceptGame" onclick="makeDecision(true)">ACCEPT</button>
           <button id="RejectGame" onclick="makeDecision(false)">REJECT</button>
           <button id="gongSound" onclick="funnySound()">gong it</button> 
           <button id="pipeSound" onclick="funnySound2()">metal pipe</button>
       </div>
   </div>

   <div class="statsStuff">
       <p id="correctCounter">Correct: 0</p>
       <p id="mistakesCounter">Mistakes: 0</p>
   </div>

   <audio id="gameMusic">
        <source src="gameMusic.mp3" type="audio/mpeg">
   </audio>
   <audio id="soundEffect">
        <source src="gong.mp3" type="audio/mpeg">
   </audio>
   <audio id="soundEffect2">
        <source src="metalpipe.mp3" type="audio/mpeg">
   </audio>
</body>
</html>
